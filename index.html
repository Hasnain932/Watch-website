        * {

        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #0b132b;
        }

        .Hero-section {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 2vh 4vw;
            box-sizing: border-box;
        }

        .logo {
            font-size: clamp(2rem, 6vw, 3.8rem);
            font-weight: bold;
            color: #e5c56d;
            text-align: center;
            margin-bottom: 1vh;
        }

        .header-nav {
            width: 100%;
            max-width: 1200px;
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 1vh 0;
        }

        .header-nav-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-nav h2 {
            color: #e5c56d;
            font-size: clamp(1rem, 3vw, 1.2rem);
            margin: 0;
        }

        .header-nav img {
            width: 20px;
            height: 20px;
        }

        .nav-menu ul {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            list-style: none;
            gap: 0.5rem;
            padding: 0;
            margin: 0;
            justify-content: center;
        }

        .nav-menu ul li a {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            color: #e5c56d;
            text-decoration: none;
            font-weight: bold;
            font-size: clamp(0.75rem, 2vw, 1.1rem);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .nav-menu ul li a:hover {
            background-color: #e5c56d;
            color: #0b132b;
            box-shadow: 0 4px 12px rgba(229, 197, 109, 0.4);
            border-radius: 8px;
        }

        .hero-text {
            text-align: center;
            margin: 2vh 0;
        }

        .hero-text h1 {
            font-size: clamp(1.4rem, 4.5vw, 3rem);
            font-weight: bold;
            text-shadow: 2px 4px 6px rgba(0, 0, 0, 0.7);
            color: #e5c56d !important;
            margin: 0;
            padding: 0 2vw;
        }

        .image-con {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: auto;
        }

        .image-con img {
            width: 85vw;
            max-width: 450px;
            height: auto;
            max-height: 40vh;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.4);
            margin-top: -55px;
        }

        .section-title {
            text-align: center;
            color: #e5c56d;
            font-size: 22px;
            text-shadow: 4px 6px 2px rgba(0, 0, 0, 0.6);
            font-weight: bold;
        }

            height: 300px;
            border: 2px solid #d4af37;
            border-radius: 15px;
        }

            overflow-x: auto;
        }

        .section {

            color: #e5c56d;
