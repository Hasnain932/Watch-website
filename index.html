<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Time</title>
    <style>
        body {
            /* overflow: hidden; */
            margin: 0;
            padding: 0;

        }


        .Hero-section {
            width: 100%;
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
        }

        .logo {
            font-size: 60px;
            font-weight: bold;
            color: #e5c56d;
        }

        .image-con img {
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            box-shadow: 0 10px 8px rgba(0, 0, 0, 0.3);
        }

        .nav-menu ul {

            border-radius: 10px;
            display: flex;
            flex-direction: row;
            list-style: none;
            gap: 7px;
            padding-left: 0;
        }

        .nav-menu ul li a {
            display: inline-block;
            padding: 8px 12px;

            color: #e5c56d;

            text-decoration: none;
            font-weight: bold;
            font-size: 20px;

            transition: all 0.3s ease;
        }

        .nav-menu ul li a:hover {
            background-color: #e5c56d;
            color: #0b132b;
            box-shadow: 0 6px 15px rgba(229, 197, 109, 0.4);
            border-radius: 12px;
        }

        .header-nav {
            width: 100%;
            background-color: #0b132b;
            display: flex;
            justify-content: center;
            padding: 0;
        }

        .header-nav img {
            width: 20px;
            height: 20px;
            margin: 1px;
        }

        .nav-menu {

            margin-left: auto
        }

        h2 {
            color: #e5c56d;
            font-size: 15px;
        }

        .hero-text h1 {
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 4px 6px rgba(0, 0, 0, 0.7);
            color: #e5c56d !important;
        }

        @media (max-width: 768px) {
            .hero-text h1 {
                font-size: 1.5rem;
            }

            .nav-menu ul li a {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 5px 0;
                font-size: 10px;
                text-align: center;
                margin: 0 8px;
                width: 75%;
            
            }

            .hero-image-con img {
                width: 100%;
            }

            .Hero-section {
                flex-direction: column;
                text-align: center;
                gap: 30px;

                .logo {
                    font-size: 38px;
                    margin-bottom: -16px;

                }
            }
        }
    </style>
</head>

<body>
    <div class="Hero-section">

        <div class="logo">
            Elite Time
        </div>
        <div class="header-nav">
            <h2>Elite Time</h2>
            <img src="img.png.jpg" alt="Elite logo">
            <diV class="nav-menu nav-links">
                <ul>
                    <li> <a href="#">Home</a></li>
                    <li><a href="#">BoysWatches</a></li>
                    <li><a href="#">GirlsWatches</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </diV>
        </div>
        <div class="hero-text">
            <h1>The Elegance of Time In Your Hand</h1>
        </div>
        <div class="image-con">
            <img src="https://images.pexels.com/photos/10343908/pexels-photo-10343908.jpeg" alt="Watch pic">
        </div>
    </div>

</body>

</html>
