<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
        }

        /* Hero Section Fixes */
        .Hero-section {
            width: 100%;
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 4vw 30px;
            box-sizing: border-box;
        }

        .logo {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: bold;
            color: #e5c56d;
            text-align: center;
            margin-bottom: 15px;
        }

        .header-nav {
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 20px;
            border: 2px solid #d4af37;
            border-radius: 15px;
            background-color: rgba(11, 19, 43, 0.6);
        }

        .header-nav-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-nav h2 {
            color: #e5c56d;
            font-size: clamp(1rem, 3vw, 1.2rem);
            margin: 0;
        }

        .header-nav img {
            width: 24px;
            height: 24px;
        }

        .nav-menu ul {
            display: flex;
            list-style: none;
            gap: 1rem;
            padding: 0;
            margin: 0;
            align-items: center;
        }

        .nav-menu ul li a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #e5c56d;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            padding: 5px 10px;
        }

        .nav-menu ul li a:hover {
            background-color: #e5c56d;
            color: #0b132b;
            border-radius: 8px;
        }

        .hero-text {
            text-align: center;
            margin: 20px 0 15px;
        }

        .hero-text h1 {
            font-size: clamp(1.4rem, 4vw, 2.5rem);
            font-weight: bold;
            text-shadow: 2px 4px 6px rgba(0, 0, 0, 0.7);
            color: #e5c56d;
            margin: 0;
        }

        .image-con {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .image-con img {
            width: 100%;
            max-width: 500px;
            height: 260px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.3);
            content-visibility: auto;
        }

        /* Section Titles */
        .section-title {
            text-align: center;
            color: #e5c56d;
            margin: 30px 0 15px;
        }

        .section-title h2, .section-title h1 {
            font-size: clamp(1.5rem, 3.5vw, 2.2rem);
            text-shadow: 2px 4px 4px rgba(0, 0, 0, 0.6);
            margin: 0;
            font-weight: bold;
        }

        /* Watch Cards Containers */
        .watches-grides {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding: 10px 4vw 25px;
            scrollbar-width: thin;
            scrollbar-color: #d4af37 transparent;
        }

        /* Improved Watch Cards Design */
        .watch-item {
            flex: 0 0 220px;
            border: 1px solid #d4af37;
            border-radius: 16px;
            background: linear-gradient(145deg, #1c2541, #0b132b);
            text-align: center;
            margin: 0;
            padding: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .watch-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
        }

        .watch-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            background-color: #0b132b;
        }

        .watch-item figcaption {
            padding-top: 10px;
        }

        .watch-item figcaption h3 {
            margin: 8px 0 4px;
            font-size: 1.1rem;
            color: #ffffff;
            font-weight: 600;
        }

        .watch-item .price {
            font-weight: bold;
            color: #e5c56d;
            font-size: 1.1rem;
            margin: 5px 0 0;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .header-nav {
                padding: 8px 12px;
            }

            .watch-item {
                flex: 0 0 180px;
                padding: 10px;
            }

            .watch-item img {
                height: 160px;
            }
            
            .image-con img {
                height: 200px;
            }
        }
    </style>
</head>
